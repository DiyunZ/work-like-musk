name: Checks

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  python:
    name: Python ${{ matrix.python }} / ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, ubuntu-latest, macos-14]
        python: ['3.12']
        include:
          - os: ubuntu-latest
            python: '3.9'
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: ${{ matrix.python }}
      - name: Run installation and migration checks
        run: python -m unittest discover -s tests -p 'test_*.py' -v
      - name: Install the coaching skill using only the standard library
        run: python -S scripts/install.py --agent generic --skill "${{ runner.temp }}/work-like-musk" --backup-root "${{ runner.temp }}/work-like-musk-backups"
