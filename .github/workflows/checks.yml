name: Checks

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  python:
    name: Python ${{ matrix.python }} / ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, ubuntu-latest, macos-14]
        python: ['3.12']
        include:
          - os: ubuntu-latest
            python: '3.9'
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: ${{ matrix.python }}
      - name: Linux GUI dependencies
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y xvfb xauth xcompmgr libegl1 libxkbcommon-x11-0 libxcb-cursor0 libxcb-icccm4 libxcb-keysyms1 libxcb-shape0 libxcb-xinerama0
      - name: Install Qt GUI runtime
        run: python -m pip install "PySide6-Essentials>=6.8,<7"
      - name: Require Qt and run tests with a compositor (Linux)
        if: runner.os == 'Linux'
        run: |
          xvfb-run -a -s '-screen 0 1280x720x24' bash -e -c '
            xcompmgr &
            compositor_pid=$!
            trap "kill $compositor_pid" EXIT
            sleep 1
            python skills/work-like-musk/scripts/portable_hud.py --check
            python -c "from PySide6.QtWidgets import QApplication,QWidget; a=QApplication([]); w=QWidget(); w.show(); a.processEvents(); assert w.isVisible(); w.close()"
            python -m unittest discover -s tests -p "test_*.py" -v
          '
      - name: Require a working Qt desktop and run tests (Windows and macOS)
        if: runner.os != 'Linux'
        run: |
          python skills/work-like-musk/scripts/portable_hud.py --check
          python -c "from PySide6.QtWidgets import QApplication,QWidget; a=QApplication([]); w=QWidget(); w.show(); a.processEvents(); assert w.isVisible(); w.close()"
          python -m unittest discover -s tests -p 'test_*.py' -v
      - name: Install the complete portable product
        run: python scripts/install.py --agent generic --hud portable --skill "${{ runner.temp }}/work-like-musk-portable" --backup-root "${{ runner.temp }}/work-like-musk-portable-backups" --language en

  native:
    name: Native macOS HUD
    runs-on: macos-14
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: Native HUD tests
        run: python3 scripts/test_native.py
      - name: Install the complete product and verify its signature
        run: |
          python3 scripts/install.py --skill "$RUNNER_TEMP/work-like-musk" --backup-root "$RUNNER_TEMP/work-like-musk-backups" --language en
          codesign --verify --deep --strict "$RUNNER_TEMP/work-like-musk/assets/FiveStepHUD.app"
